services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: anomaly_detector
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superpassword
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser -d anomaly_detector"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: anomaly_detector_test
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: superpassword
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-54330}:5432"
    volumes:
      - postgres_18_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser -d anomaly_detector_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_18_data:
  postgres_18_test_data:
