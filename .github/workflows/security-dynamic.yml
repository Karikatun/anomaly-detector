name: Dynamic Security

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'

concurrency:
  group: dynamic-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-api:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_TEST_PORT: '55432'
      TEST_DATABASE_URL: postgresql://superuser:superpassword@localhost:55432/anomaly_detector_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ZAP authenticated API scan
        run: bun run security:zap

      - name: Upload redacted ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-api-report
          path: .scratch/security/zap/**/sanitized/report.*
          if-no-files-found: error
          retention-days: 7
