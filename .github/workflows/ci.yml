name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - mobile

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Gitleaks history scan
        run: bun run security:gitleaks

      - name: Semgrep high-confidence rules
        run: bun run security:semgrep

      - name: Trivy configuration scan
        run: bun run security:trivy:config

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency security audit
        run: bun run security:dependencies

      - name: Secret hygiene
        run: bun run security:secrets

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Architecture boundaries
        run: bun run architecture:check

      - name: Client lint
        run: bun run lint

      - name: Deployment and script tests
        run: bun run test:deploy

      - name: Repository tooling tests
        run: bun run test:tooling

      - name: Contract tests
        run: bun run test:contracts

      - name: Webapp client tests
        run: bun run test:webapp

      - name: Public website tests
        run: bun run test:website

      - name: Admin client tests
        run: bun run test:adminapp

      - name: Backend tests
        run: bun run test:backend

      - name: Backend Docker smoke
        run: bun run smoke:backend:docker

      - name: Trivy backend image scan
        run: bun run security:trivy:image anomaly-detector-backend:smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        run: bun run --cwd webapp e2e:install

      - name: Webapp E2E smoke
        run: bun run e2e:webapp
